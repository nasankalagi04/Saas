
<h2>Add Project</h2>
<div class="stats">
<form method="POST">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Project Name">
    <!--Department name-->
    <div class="form-group">
    <label>Select Department </label>
    <select name="department_id" class="dropdown" >
    {% for dept in department %}
        <option value="{{ dept.id }}">
            {{ dept.name }}
        </option>
    {% endfor %}
    </select>
    </div>

    <!--Manager Names-->
    <div class="form-group">
    <label>Select Manager </label>
    <select name="manager_id" class="dropdown">
    {% for emp in manager %}
        <option value="{{ emp.id }}">
            {{ emp.id }} - {{emp.user }}
        </option>
    {% empty %}
        <option>No managers available</option>
    {% endfor %}
    </select>
    </div>

    <!--employee name-->
    <div class="form-group">
    <label>Select Employees:</label>
    <select  name="employee_ids" class="dropdown" multiple  >
    {% for emp in employees %}
        <option   value="{{ emp.id }}">
            {{emp.id}} - {{ emp.user }}
        </option>
    {% endfor %}
    </select>
    </div>
    <button type="submit">Add</button>
</form>
</div>
